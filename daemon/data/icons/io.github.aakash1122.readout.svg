<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="baseFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.55" stop-color="#e3e6eb"/>
      <stop offset="1" stop-color="#c2c8d1"/>
    </linearGradient>
    <linearGradient id="baseEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bezelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d95a3"/>
      <stop offset="1" stop-color="#f6f7f9"/>
    </linearGradient>
    <radialGradient id="faceFill" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2c3446"/>
      <stop offset="0.7" stop-color="#161b26"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="valueFill" gradientUnits="userSpaceOnUse" x1="70" y1="180" x2="190" y2="80">
      <stop offset="0" stop-color="#2fe0c8"/>
      <stop offset="0.5" stop-color="#7be35a"/>
      <stop offset="1" stop-color="#ffb43d"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="needleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ec"/>
    </linearGradient>
    <radialGradient id="hubFill" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa3b2"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="faceClip">
      <circle cx="128" cy="128" r="86"/>
    </clipPath>
  </defs>

  <!-- squircle base with drop shadow -->
  <rect x="22" y="28" width="212" height="212" rx="50" fill="#000000" opacity="0.32" filter="url(#dropShadow)"/>
  <rect x="20" y="20" width="216" height="216" rx="50" fill="url(#baseFill)"/>
  <rect x="21" y="21" width="214" height="214" rx="49" fill="none" stroke="url(#baseEdge)" stroke-width="2"/>
  <rect x="20" y="20" width="216" height="216" rx="50" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>

  <!-- recessed bezel -->
  <circle cx="128" cy="130" r="96" fill="#000000" opacity="0.18" filter="url(#softBlur)"/>
  <circle cx="128" cy="128" r="95" fill="url(#bezelFill)"/>
  <circle cx="128" cy="128" r="88" fill="#0a0d13"/>

  <!-- dial face -->
  <circle cx="128" cy="128" r="86" fill="url(#faceFill)"/>

  <g clip-path="url(#faceClip)">
    <!-- tick marks -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-width="3" opacity="0.35">
      <path d="M128 52v8"/>
      <path d="M74.3 74.3l5.6 5.6"/>
      <path d="M181.7 74.3l-5.6 5.6"/>
      <path d="M52 128h8"/>
      <path d="M204 128h-8"/>
    </g>

    <!-- track -->
    <path d="M85.6 170.4A60 60 0 1 1 170.4 170.4" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="19" stroke-linecap="round"/>
    <!-- value glow + value arc (about 72%) -->
    <path d="M85.6 170.4A60 60 0 1 1 177.3 93.6" fill="none" stroke="url(#valueFill)" stroke-width="21" stroke-linecap="round" opacity="0.75" filter="url(#arcGlow)"/>
    <path d="M85.6 170.4A60 60 0 1 1 177.3 93.6" fill="none" stroke="url(#valueFill)" stroke-width="19" stroke-linecap="round"/>

    <!-- readout pill in the gauge gap -->
    <rect x="106" y="170" width="44" height="18" rx="6" fill="#000000" opacity="0.45"/>
    <g fill="#2fe0c8">
      <rect x="112" y="179" width="5" height="5" rx="1.5"/>
      <rect x="120" y="176" width="5" height="8" rx="1.5"/>
      <rect x="128" y="174" width="5" height="10" rx="1.5" fill="#7be35a"/>
      <rect x="136" y="177" width="5" height="7" rx="1.5" fill="#ffb43d"/>
    </g>
  </g>

  <!-- needle -->
  <path d="M123.2 138.4 L174.8 97.2 Q175.7 93.3 171.8 93.0 L116.6 129.3 Z" fill="#000000" opacity="0.35" transform="translate(0 3)" filter="url(#softBlur)"/>
  <path d="M123.2 138.4 L174.8 97.2 Q175.7 93.3 171.8 93.0 L116.6 129.3 Z" fill="url(#needleFill)"/>
  <circle cx="128" cy="128" r="14" fill="url(#hubFill)"/>
  <circle cx="128" cy="128" r="5" fill="#1a1f2b"/>

  <!-- glass highlight -->
  <path d="M46 120 A86 86 0 0 1 210 120 C180 96 76 96 46 120 Z" fill="url(#glassFill)" opacity="0.6"/>
  <circle cx="128" cy="128" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
